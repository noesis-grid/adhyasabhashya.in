<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adhyasa Bhashya — Coming Soon</title>
  <meta name="description" content="Adhyasa Bhashya — A digital space dedicated to Adi Shankaracharya's introduction to the Brahma Sutra Bhashya." />
  <style>
    :root {
      --bg: #faf8f4;
      --surface: #ffffff;
      --text: #1f1d1a;
      --muted: #6b655c;
      --accent: #9a5b25;
      --border: #e7e1d7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121110;
        --surface: #1a1816;
        --text: #ece7df;
        --muted: #9f978b;
        --accent: #d49557;
        --border: #2b2723;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
      padding: 1.5rem;
    }

    main {
      max-width: 580px;
      width: 100%;
      text-align: center;
      padding: 3.5rem 2.25rem;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.04);
    }

    .sanskrit {
      font-size: 1.35rem;
      color: var(--accent);
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: clamp(1.9rem, 5vw, 2.5rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      margin-bottom: 1rem;
    }

    .divider {
      width: 48px;
      height: 1px;
      background-color: var(--accent);
      margin: 1.25rem auto;
      opacity: 0.6;
    }

    p {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      padding: 0.45rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent);
    }

    footer {
      margin-top: 2.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <main>
    <div class="sanskrit" lang="sa">अध्यास भाष्यम्</div>
    <h1>Adhyasa Bhashya</h1>
    <div class="divider" aria-hidden="true"></div>
    <p>
      This space is currently being prepared. Check back soon for the full site.
    </p>
    <div class="status">
      <span class="dot" aria-hidden="true"></span>
      Coming Soon
    </div>
    <footer>adhyasabhashya.in</footer>
  </main>
</body>
</html>
